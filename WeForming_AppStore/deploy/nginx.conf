# WeForming App Store — nginx reverse proxy (TLS terminates here).
#
# Single origin: the SPA and the API are both served under https://<FQDN>, so the
# browser makes same-origin requests (no CORS needed). Keycloak is NOT proxied — the
# browser never talks to it (login is ROPC proxied by the backend).
#
# Assumes the Docker stack publishes the containers on localhost only:
#   backend  -> 127.0.0.1:8000
#   frontend -> 127.0.0.1:8080
# (see docker-compose.yml port bindings).
#
# Install: copy to /etc/nginx/sites-available/weforming.conf, then
#   ln -s /etc/nginx/sites-available/weforming.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx

# Redirect all HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name apps.example.com;          # <-- your FQDN
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name weforming-appstore.argovoltlabs.eu;           

    # TLS — point these at your installed certificate/key
    ssl_certificate     /etc/letsencrypt/live/apps.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/apps.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Allow reasonably large app-icon uploads (publish form)
    client_max_body_size 25M;

    # API -> backend container. No trailing slash/path on proxy_pass, so the full
    # /api/... URI is passed through unchanged (backend routes live under /api).
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else -> frontend SPA container (it handles client-side routing).
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
